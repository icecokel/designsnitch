name: Release

# v0.2.0 같은 태그를 푸시하면 npm에 배포한다. main에 병합하는 것만으로는 배포되지 않는다.
# 인증은 npm Trusted Publishing(OIDC)을 쓴다. npm 패키지 설정에 이 저장소와
# 이 파일 이름(release.yml)이 Trusted Publisher로 등록되어 있어야 한다.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 태그와 package.json 버전이 같은지 확인
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전($version)이 다릅니다."
            exit 1
          fi

      - name: main에 있는 커밋인지 확인
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::태그가 붙은 커밋이 main에 없습니다. main에 병합한 뒤 태그를 붙이세요."
            exit 1
          fi

      # Trusted Publishing 은 npm 11.5.1 이상이 필요하다. Node 24 에 들어 있다.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm test
      - run: npm publish
